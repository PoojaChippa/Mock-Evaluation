<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>TimeFlow | Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/styles.css" />
</head>

<body class="body-gradient">
    <header class="header">
        <div class="logo">⏱️ Daily Time-Tracker</div>
    </header>

    <main class="auth-container">
        <section class="auth-card">
            <h1>Welcome back 👋</h1>
            <p class="subtitle">Track where your 24 hours really go.</p>

            <form id="auth-form" class="form">
                <div class="tabs">
                    <button type="button" class="tab-button active" data-mode="login">
                        Login
                    </button>
                    <button type="button" class="tab-button" data-mode="signup">
                        Sign up
                    </button>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input id="email" type="email" required placeholder="you@example.com" />
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input id="password" type="password" required placeholder="••••••••" />
                </div>

                <button id="submit-btn" type="submit" class="btn-primary">
                    Login
                </button>

                <div class="divider">
                    <span>or</span>
                </div>

                <button id="google-btn" type="button" class="btn-ghost">
                    <span>🔐</span> Continue with Google
                </button>

                <p id="auth-error" class="error-text"></p>
            </form>

            <!-- <p class="small-text">
                Built with Firebase, HTML/CSS/JS, and a little AI ✨
            </p> -->
        </section>
    </main>

    <footer class="footer">
        <p>© <span id="year"></span> TimeFlow. Make your minutes matter.</p>
    </footer>

    <script type="module">
        import { initAuthForIndex } from './js/auth.js';
        document.getElementById('year').textContent = new Date().getFullYear();
        initAuthForIndex();
    </script>
</body>

</html>
